<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 130" width="170" height="130" role="img" aria-label="Robô tomando café" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .robo   { animation: bob 5s ease-in-out infinite; }
    .antena { animation: pisca 1.6s ease-in-out infinite; }
    .peito  { animation: pulsa 2.5s ease-in-out infinite; }

    .olhos  { animation: olhosNormais 5s linear infinite; }
    .olhos-abertos { transform-box: fill-box; transform-origin: center; animation: piscar 5s linear infinite; }
    .feliz  { opacity: 0; animation: olhosFelizes 5s linear infinite; }
    .rubor  { opacity: 0; animation: olhosFelizes 5s linear infinite; }

    .xicara { transform: translate(128px, 98px); animation: gole 5s ease-in-out infinite; }
    .vapor  { animation: vaporVisivel 5s linear infinite; }
    .fio    { animation: sobe 2.1s ease-out infinite; opacity: 0; }
    .fio2   { animation-delay: -0.7s; }
    .fio3   { animation-delay: -1.4s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(1.5px); }
    }
    @keyframes pisca {
      0%, 100% { opacity: 1; }
      50%      { opacity: .35; }
    }
    @keyframes pulsa {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    @keyframes gole {
      0%, 38%   { transform: translate(128px, 98px) rotate(0deg); }
      52%, 72%  { transform: translate(91px, 57px) rotate(-32deg); }
      86%, 100% { transform: translate(128px, 98px) rotate(0deg); }
    }
    @keyframes vaporVisivel {
      0%, 36%   { opacity: 1; }
      44%, 80%  { opacity: 0; }
      90%, 100% { opacity: 1; }
    }
    @keyframes sobe {
      0%   { transform: translateY(0);     opacity: 0; }
      30%  { opacity: .9; }
      100% { transform: translateY(-11px); opacity: 0; }
    }
    @keyframes olhosNormais {
      0%, 50%   { opacity: 1; }
      53%, 74%  { opacity: 0; }
      77%, 100% { opacity: 1; }
    }
    @keyframes olhosFelizes {
      0%, 50%   { opacity: 0; }
      53%, 74%  { opacity: 1; }
      77%, 100% { opacity: 0; }
    }
    @keyframes piscar {
      0%, 16%, 20%, 100% { transform: scaleY(1); }
      18%                { transform: scaleY(.1); }
    }
  </style>

  <g class="robo">
    <!-- antena -->
    <line x1="80" y1="22" x2="80" y2="11" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/>
    <circle class="antena" cx="80" cy="8" r="4.5" fill="#58a6ff"/>

    <!-- cabeça -->
    <rect x="50" y="22" width="60" height="44" rx="14" fill="#1f2630" stroke="#58a6ff" stroke-width="2.5"/>
    <rect x="57" y="29" width="46" height="30" rx="9" fill="#0d1117"/>

    <!-- olhos normais (com piscada) -->
    <g class="olhos">
      <g class="olhos-abertos">
        <circle cx="70" cy="42" r="4.2" fill="#58a6ff"/>
        <circle cx="90" cy="42" r="4.2" fill="#58a6ff"/>
      </g>
      <path d="M75 51 Q80 54.5 85 51" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- olhos felizes durante o gole -->
    <g class="feliz" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-linecap="round">
      <path d="M65.5 44 Q70 38 74.5 44"/>
      <path d="M85.5 44 Q90 38 94.5 44"/>
    </g>
    <g class="rubor" fill="#f778ba" opacity="0">
      <ellipse cx="63" cy="50" rx="3" ry="1.6"/>
      <ellipse cx="97" cy="50" rx="3" ry="1.6"/>
    </g>

    <!-- orelhas -->
    <rect x="45" y="37" width="5" height="14" rx="2.5" fill="#8b949e"/>
    <rect x="110" y="37" width="5" height="14" rx="2.5" fill="#8b949e"/>

    <!-- pescoço e corpo -->
    <rect x="73" y="66" width="14" height="6" rx="2" fill="#8b949e"/>
    <rect x="54" y="72" width="52" height="42" rx="12" fill="#1f2630" stroke="#58a6ff" stroke-width="2.5"/>
    <circle class="peito" cx="80" cy="89" r="5" fill="#58a6ff"/>
    <line x1="68" y1="102" x2="92" y2="102" stroke="#30363d" stroke-width="2.5" stroke-linecap="round"/>

    <!-- braço esquerdo -->
    <rect x="43" y="78" width="10" height="26" rx="5" fill="#8b949e"/>
    <!-- ombro direito -->
    <rect x="107" y="78" width="10" height="14" rx="5" fill="#8b949e"/>
  </g>

  <!-- pires (fica parado) -->
  <rect x="115" y="107" width="25" height="2.5" rx="1.25" fill="#8b949e"/>

  <!-- xícara com mão flutuante e vapor -->
  <g class="xicara">
    <g class="vapor" fill="none" stroke="#c9d1d9" stroke-width="1.8" stroke-linecap="round">
      <path class="fio"      d="M-5 -14 q-3 -4 0 -8 q3 -4 0 -8"/>
      <path class="fio fio2" d="M0 -14 q-3 -4 0 -8 q3 -4 0 -8"/>
      <path class="fio fio3" d="M5 -14 q-3 -4 0 -8 q3 -4 0 -8"/>
    </g>
    <path d="M10 -6 h3 a5 5 0 0 1 0 10 h-3" fill="none" stroke="#e6edf3" stroke-width="2.5"/>
    <path d="M-11 -10 h21 v13 a5 5 0 0 1 -5 5 h-11 a5 5 0 0 1 -5 -5 z" fill="#e6edf3"/>
    <ellipse cx="-0.5" cy="-10" rx="10.5" ry="2.6" fill="#6f4a2e"/>
    <circle cx="-13" cy="-1" r="4.5" fill="#8b949e"/>
  </g>
</svg>
